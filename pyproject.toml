[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchgoblin"
version = "0.1.0"
description = "Your open-source contribution copilot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.scripts]
goblin = "patchgoblin.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patchgoblin"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (Typer pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["patchgoblin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
